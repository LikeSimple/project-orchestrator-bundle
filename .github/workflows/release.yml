name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project-orchestrator-bundle/mcp-integration/package-lock.json

      - name: Install dependencies
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm ci

      - name: Build
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm run build

      - name: Run tests
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm test
        env:
          CI: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            project-orchestrator-bundle/mcp-integration/dist/*.js
            project-orchestrator-bundle/mcp-integration/dist/*.cjs
