name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: project-orchestrator-bundle/mcp-integration/package-lock.json

      - name: Install dependencies
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm ci

      - name: Type check
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npx tsc --noEmit

      - name: Build
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm run build

      - name: Run tests
        working-directory: project-orchestrator-bundle/mcp-integration
        run: npm test
        env:
          CI: true

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: project-orchestrator-bundle/mcp-integration/dist/
          retention-days: 7
