openapi: 3.1.2
info:
  title: 客服系统 API（契约测试示例）
  version: 1.0.0
  description: |
    完整的 OpenAPI 3.1.2 契约示例，用于演示 test-runner 契约测试的自动生成。
    覆盖 18 个端点，包含完整的安全方案、错误响应、Problem schema。
  x-generated-by: project-orchestrator-bundle / test-runner
  x-test-coverage: 100%

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.example.com/v1
    description: 生产
  - url: https://staging-api.example.com/v1
    description: 预发
  - url: http://localhost:8080/v1
    description: 本地开发

tags:
  - name: Auth
    summary: 鉴权
  - name: Accounts
    summary: 账号接入管理
  - name: Timesheets
    summary: 工时记录
  - name: Projects
    summary: 项目管理
  - name: Boards
    summary: 看板
  - name: Notifications
    summary: 通知
  - name: Uploads
    summary: 文件上传
  - name: Reports
    summary: 报表
  - name: Webhooks
    summary: 回调

security:
  - BearerAuth: []

paths:
  # 1. POST /api/v1/auth/login
  /auth/login:
    post:
      operationId: login
      summary: 用户登录
      tags: [Auth]
      security: []  # 公开端点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # 2. POST /api/v1/auth/sms
  /auth/sms:
    post:
      operationId: sendSmsCode
      summary: 发送短信验证码
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsRequest' }
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresIn: { type: integer, description: 过期秒数 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # 3. POST /api/v1/auth/oauth/douyin
  /auth/oauth/douyin:
    post:
      operationId: douyinOAuth
      summary: 抖音 OAuth 回调
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthRequest' }
      responses:
        '200':
          description: 接入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # 4. GET /api/v1/accounts
  /accounts:
    get:
      operationId: listAccounts
      summary: 列出已接入账号
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: platform
          in: query
          schema:
            type: string
            enum: [douyin, wechat, xhs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # 5. POST /api/v1/accounts/{id}/disable
  /accounts/{id}/disable:
    post:
      operationId: disableAccount
      summary: 停用账号
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # 6. DELETE /api/v1/accounts/{id}
  /accounts/{id}:
    delete:
      operationId: deleteAccount
      summary: 删除账号
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # 7. POST /api/v1/timesheets
  /timesheets:
    post:
      operationId: createTimesheet
      summary: 创建工时记录
      tags: [Timesheets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimesheetCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timesheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # 8. GET /api/v1/timesheets
    get:
      operationId: listTimesheets
      summary: 查询工时列表
      tags: [Timesheets]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Timesheet' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # 9. GET /api/v1/projects
  /projects:
    get:
      operationId: listProjects
      summary: 列出项目
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  # 10. POST /api/v1/projects
    post:
      operationId: createProject
      summary: 创建项目
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # 11. GET /api/v1/boards/{id}
  /boards/{id}:
    get:
      operationId: getBoard
      summary: 获取看板
      tags: [Boards]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 12. POST /api/v1/boards/{id}/cards
  /boards/{id}/cards:
    post:
      operationId: createCard
      summary: 创建卡片
      tags: [Boards]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 13. PATCH /api/v1/cards/{id}
  /cards/{id}:
    patch:
      operationId: updateCard
      summary: 更新卡片
      tags: [Boards]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 14. DELETE /api/v1/cards/{id}
    delete:
      operationId: deleteCard
      summary: 删除卡片
      tags: [Boards]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # 15. GET /api/v1/notifications
  /notifications:
    get:
      operationId: listNotifications
      summary: 通知列表
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  # 16. POST /api/v1/uploads
  /uploads:
    post:
      operationId: uploadFile
      summary: 文件上传
      tags: [Uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [avatar, attachment, image]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: 文件过大
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # 17. GET /api/v1/reports/weekly
  /reports/weekly:
    get:
      operationId: getWeeklyReport
      summary: 获取周报
      tags: [Reports]
      parameters:
        - name: weekStart
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReport' }

  # 18. POST /api/v1/webhooks/douyin
  /webhooks/douyin:
    post:
      operationId: douyinWebhook
      summary: 抖音事件回调
      tags: [Webhooks]
      security:
        - DouyinWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Webhook processed }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DouyinWebhookSecret:
      type: apiKey
      in: header
      name: X-Douyin-Signature

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 无权限
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 资源冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: 业务校验失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 限流
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: 服务器内部错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri, example: 'https://docs.example.com/errors/validation' }
        title: { type: string, example: '参数校验失败' }
        status: { type: integer, example: 400 }
        detail: { type: string, example: 'field "email" must be a valid address' }
        instance: { type: string, format: uri }
        code: { type: string, example: 'U1023', description: '业务错误码' }
        category:
          type: string
          enum: [USER_ERROR, SYSTEM_ERROR, EXTERNAL_ERROR]
        traceId: { type: string, example: '8e9b2c1f5a' }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [admin, manager, viewer]
        createdAt: { type: string, format: date-time, readOnly: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 20 }
        code: { type: string, pattern: '^\\d{6}$', description: 6 位验证码（可选） }

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: JWT token (2h 过期)' }
        user: { $ref: '#/components/schemas/User' }

    SmsRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }

    OAuthRequest:
      type: object
      required: [code, state]
      properties:
        code: { type: string, description: OAuth 授权码' }
        state: { type: string, description: 防 CSRF state' }

    Account:
      type: object
      required: [id, platform, status]
      properties:
        id: { type: string, format: uuid }
        platform:
          type: string
          enum: [douyin, wechat, xhs]
        status:
          type: string
          enum: [active, disabled]
        boundAt: { type: string, format: date-time, readOnly: true }
        disabledAt: { type: string, format: date-time, nullable: true, readOnly: true }

    Project:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        status:
          type: string
          enum: [active, archived]
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, readOnly: true }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    Timesheet:
      type: object
      required: [id, projectId, userId, date, hours]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        projectId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        date: { type: string, format: date }
        hours: { type: number, minimum: 0.25, maximum: 24, multipleOf: 0.25 }
        description: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time, readOnly: true }

    TimesheetCreate:
      type: object
      required: [projectId, date, hours]
      properties:
        projectId: { type: string, format: uuid }
        date: { type: string, format: date }
        hours: { type: number, minimum: 0.25, maximum: 24, multipleOf: 0.25 }
        description: { type: string, maxLength: 500 }

    Board:
      type: object
      required: [id, projectId, name]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        columns:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              order: { type: integer }

    Card:
      type: object
      required: [id, boardId, columnId, title]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        boardId: { type: string, format: uuid }
        columnId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        order: { type: integer }
        assigneeId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        tags:
          type: array
          items: { type: string }

    CardCreate:
      type: object
      required: [columnId, title]
      properties:
        columnId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }

    CardUpdate:
      type: object
      properties:
        columnId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        assigneeId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }

    Notification:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [mention, due_date, system]
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time, readOnly: true }

    UploadResult:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        size: { type: integer }
        mimeType: { type: string }

    WeeklyReport:
      type: object
      properties:
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        totalHours: { type: number }
        projectBreakdown:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              hours: { type: number }
              percentage: { type: number }

    WebhookEvent:
      type: object
      required: [event, timestamp, data]
      properties:
        event: { type: string, example: 'message.received' }
        timestamp: { type: integer, description: Unix 时间戳' }
        data:
          type: object
          additionalProperties: true